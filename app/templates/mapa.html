{% extends "base.html" %}
{% block title %}Mapa{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
{% endblock %}

{% block content %}
<!-- El progreso va ARRIBA, antes del mapa. Es lo primero que se mira al abrir
     la página, y es lo que convierte un mapa de chinchetas en algo que se va
     completando. -->
<section class="card" id="progreso-card">
  <div class="progreso-cabecera">
    <h1>Mapa</h1>
    <select id="filtro-anio" aria-label="Filtrar por año"></select>
  </div>

  <div class="marcadores" id="progreso-cifras"></div>

  <div id="tablero">
    <p class="muted" id="tablero-resumen"></p>
    <ul class="casillas" id="tablero-casillas"></ul>
    <p class="muted" id="tablero-otras" hidden></p>
  </div>
</section>

<section class="card">
  <div id="mapa" role="application" aria-label="Mapa del trayecto del viaje"></div>

  <!-- Revivir el viaje: recorre los momentos en orden, centrando el mapa en
       cada uno. Es la diferencia entre un mapa de chinchetas y volver a
       recorrer lo que pasó. -->
  <div class="revivir">
    <button type="button" id="revivir-btn" class="primary">▶  Revivir el viaje</button>
    <input type="range" id="revivir-slider" min="0" value="0" step="1"
           aria-label="Momento del viaje">
    <p class="muted" id="revivir-pie"></p>
  </div>

  <!-- Sin cobertura los tiles no cargan y el mapa sale gris, pero el trayecto
       y los momentos siguen ahí porque salen de nuestro servidor. Se dice en
       vez de disimularlo. -->
  <p class="muted" id="mapa-aviso" hidden></p>
</section>

<section class="card" id="visitados-card" hidden>
  <h2>Sitios a los que vuelves</h2>
  <ul class="visitados" id="visitados-lista"></ul>
</section>

<section class="card">
  <h2>Día a día</h2>
  <p id="notas-estado" class="status" aria-live="polite"></p>
  <p class="muted" id="ruta-avisos" hidden></p>
  <div id="dias-lista"></div>
</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
{% endblock %}
