<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + los safe-area del CSS evitan que el notch del
       iPhone se coma la interfaz cuando la app está instalada como PWA. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b3a2f">
  <title>{% block title %}Compañero de viaje{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <span class="brand">Compañero de viaje</span>
    {% if session.get('authenticated') %}
      <a class="logout" href="{{ url_for('logout') }}">Salir</a>
    {% endif %}
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
