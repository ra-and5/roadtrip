[pytest]
# Sin esto, pytest recolecta desde la raíz TODO lo que parezca un test, incluido
# lo que haya suelto en la copia de trabajo y no sea del proyecto (una carpeta
# con otros repos dentro, por ejemplo). Sus tests fallan al importar y la suite
# entera se interrumpe en la fase de colección, así que `python -m pytest -q`
# —el comando documentado en CLAUDE.md— deja de funcionar por algo que no tiene
# nada que ver con el código. La suite de este proyecto vive en tests/ y en
# ningún otro sitio.
testpaths = tests
